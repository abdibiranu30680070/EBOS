<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Main Emblem Gradient (Electric Royal Blue to Indigo) -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>

  <!-- Subtle Outer Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#primary-grad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Logo Group -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Hexagonal Outer Shield Path -->
    <path d="M 0 -185 L 140 -105 L 140 55 L 0 135 L -140 55 L -140 -105 Z" 
          fill="none" 
          stroke="url(#primary-grad)" 
          stroke-width="26" 
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Stylized Interlocking 'E' & Growth Bars -->
    <!-- Bar 1 (Left vertical stem of E) -->
    <path d="M -85 -95 L -85 95" stroke="url(#primary-grad)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Top arm of E -->
    <path d="M -85 -80 L 75 -80" stroke="url(#primary-grad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Middle arm of E with Gold Accent -->
    <path d="M -85 0 L 40 0" stroke="url(#gold-grad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Bottom arm of E -->
    <path d="M -85 80 L 85 80" stroke="url(#primary-grad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Star/Spark Dot Accent (Ethiopian Heritage / Growth) -->
    <circle cx="85" cy="-80" r="14" fill="url(#gold-grad)"/>
  </g>
</svg>